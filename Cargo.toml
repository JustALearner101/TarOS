[package]
name = "tarOS"
version = "0.1.0"
edition = "2021"
authors = ["Akhtar Jaffan Ramadhan <"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "taros"
path = "src/main.rs"
test = false
doctest = false
bench = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# Bootloader dependencies
[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04"]